[project]
name = "ibm-ai-engineering"
version = "0.1.0"
description = "IBM AI Engineering course: supervised and unsupervised ML with Python"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    # Jupyter / notebook runtime
    "ipykernel>=7.0.0",
    "ipython>=9.0.0",
    # Data processing
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.10.0",
    # Machine learning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.0.0",
    # Geospatial / clustering (notebook 11)
    "contextily>=1.7.0",
    "geopandas>=1.1.3",
    "hdbscan>=0.8.42",
    "shapely>=2.1.2",
]
